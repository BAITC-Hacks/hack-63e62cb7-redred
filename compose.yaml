services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hackalem
      POSTGRES_USER: hackalem
      POSTGRES_PASSWORD: hackalem
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackalem -d hackalem"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
