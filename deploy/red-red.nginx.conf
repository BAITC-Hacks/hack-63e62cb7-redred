# Include INSIDE the existing Staffvision HTTPS server { } block.
# This proxy must run on the host that publishes Compose port 8083.
location = /red-red {
    return 301 /red-red/;
}

location ^~ /red-red/ {
    # Trailing slash strips /red-red/ before forwarding to the container.
    proxy_pass http://127.0.0.1:8083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cookie_path / /red-red/;
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
